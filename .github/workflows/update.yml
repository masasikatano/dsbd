name: update-dashboard

on:
  # スケジュール実行は Oracle Cloud VM の cron（JST 平日 6:30）に移管した。
  # GitHub Actions のスケジュール実行はキューイングで数時間遅延することがあるため。
  # 手動での再実行が必要な場合は workflow_dispatch を使う。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch and compute
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python -m src.update
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update latest.json [skip ci]"
          git push
