name: update-dashboard

on:
  schedule:
    # JST 平日 7:41（JSTはUTC+9で夏時間なし）= UTC 日〜木 22:41。前日の米国終値が出揃う時刻。
    # :00 は GitHub Actions のスケジュール実行が集中し遅延しやすいため分をずらしている。
    - cron: "41 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch and compute
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python -m src.update
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update latest.json [skip ci]"
          git push
