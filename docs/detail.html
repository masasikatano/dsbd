<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>指標詳細 | マクロ・ETF投資判断ダッシュボード</title>
  <style>
    :root {
      --bg: #12151c;
      --bg2: #1a1f2b;
      --fg: #e8edf5;
      --muted: #8b95a8;
      --line: #2a3244;
      --green: #3dcc8a;
      --red: #ef6b6b;
      --yellow: #e0b54a;
      --must: #c45c5c;
      --next: #3d7aab;
      --adv: #6b6380;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }
    header {
      padding: 1.2rem 1.2rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--bg2);
    }
    a.back {
      color: var(--muted);
      text-decoration: none;
      font-size: .9rem;
      display: inline-block;
      margin-bottom: .6rem;
    }
    a.back:hover { color: var(--fg); }
    h1 { margin: 0 0 .35rem; font-size: 1.35rem; font-weight: 650; }
    .sub { color: var(--muted); font-size: .95rem; margin: 0; }
    .badge {
      display: inline-block;
      font-size: .68rem;
      padding: .08rem .4rem;
      border-radius: 999px;
      color: #fff;
      margin-right: .25rem;
    }
    .must { background: var(--must); }
    .next { background: var(--next); }
    .advanced { background: var(--adv); }
    main {
      padding: 1.2rem 1.2rem 3rem;
      max-width: 960px;
      margin: 0 auto;
    }
    .card {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .9rem 1rem;
      margin-bottom: 1rem;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0 0 .6rem;
      font-weight: 600;
      color: var(--fg);
    }
    .chart-wrap { position: relative; }
    #chart { width: 100%; height: 360px; display: block; cursor: pointer; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: .75rem;
    }
    .metric {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .8rem .7rem;
      text-align: center;
    }
    .metric .label {
      color: var(--muted);
      font-size: .75rem;
      margin-bottom: .25rem;
    }
    .metric .value {
      font-size: 1.25rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .warn { color: var(--yellow); }
    .miss { color: var(--muted); }
    .note { color: var(--muted); white-space: pre-wrap; }
    .meta { color: var(--muted); font-size: .85rem; margin-top: .4rem; }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 3rem 1rem;
    }
    .tip {
      position: fixed;
      pointer-events: none;
      background: #0e1218;
      border: 1px solid var(--line);
      color: var(--fg);
      font-size: .75rem;
      padding: .25rem .4rem;
      border-radius: 4px;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back">← ダッシュボードに戻る</a>
    <h1 id="title">読み込み中…</h1>
    <p class="sub" id="subtitle"></p>
  </header>
  <main id="main">
    <div class="empty">読み込み中…</div>
  </main>
  <div class="tip" id="tip"></div>
  <script src="common.js"></script>
  <script>
    function metricCard(label, value, cls) {
      return `<div class="metric">
        <div class="label">${label}</div>
        <div class="value ${cls || ""}">${value}</div>
      </div>`;
    }
    function renderDetail(item) {
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const main = document.getElementById("main");

      title.textContent = item.name || item.id;
      const pri = item.priority || "next";
      const badge = `<span class="badge ${pri}">${PRI[pri] || pri}</span>`;
      const statusText = item.status === "ok" ? "ok" : `missing（${item.error || "データなし"}）`;
      subtitle.innerHTML = `${badge}${item.market || ""} · ${item.ticker || ""} · ${item.unit || ""} · 最終日付 ${item.last_date || "—"} · status ${statusText}`;

      const miss = item.status !== "ok";
      const chg = signed(item.chg_1d_pct);
      const ytd = signed(item.ytd_pct);
      const pos = signed(item.pos_52w_pct);
      const d200 = signed(item.dev_200d_pct);
      const vol = signed(item.vol_1y_pct);
      const lastCls = lastClass(item);

      const lastValue = miss ? "—" : fmt(item.last);
      const metricsHtml = `
        ${metricCard("最終値", lastValue, lastCls)}
        ${metricCard("前日比％", chg.t, chg.c)}
        ${metricCard("年初来％", ytd.t, ytd.c)}
        ${metricCard("52週位置％", pos.t, pos.c)}
        ${metricCard("200日乖離％", d200.t, d200.c)}
        ${metricCard("1年ボラ％", vol.t, vol.c)}
      `;

      const noteHtml = item.note
        ? `<div class="card"><h2>備考</h2><div class="note">${item.note}</div></div>`
        : "";

      main.innerHTML = `
        <div class="card chart-wrap">
          <h2>約2年の推移（間引き）</h2>
          <canvas id="chart"></canvas>
        </div>
        <div class="metrics">${metricsHtml}</div>
        ${noteHtml}
      `;

      const canvas = document.getElementById("chart");
      drawLine(canvas, item, { l: 8, r: 12, t: 12, b: 16 });
      bindHover(canvas, item);
    }
    function renderNotFound(message) {
      document.getElementById("title").textContent = "エラー";
      document.getElementById("subtitle").textContent = "";
      document.getElementById("main").innerHTML = `<div class="empty">${message}<br><a href="index.html" class="back">ダッシュボードに戻る</a></div>`;
    }
    async function main() {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      if (!id) {
        renderNotFound("指標IDが指定されていません。");
        return;
      }
      const res = await fetch("data/latest.json");
      if (!res.ok) {
        renderNotFound("latest.json を読み込めませんでした。");
        return;
      }
      const data = await res.json();
      const item = (data.items || []).find(i => i.id === id);
      if (!item) {
        renderNotFound(`指標「${id}」が見つかりません。`);
        return;
      }
      renderDetail(item);
      window.addEventListener("resize", () => {
        const canvas = document.getElementById("chart");
        if (canvas) drawLine(canvas, item, { l: 8, r: 12, t: 12, b: 16 });
      });
    }
    main().catch(e => {
      renderNotFound("読み込みに失敗しました: " + e);
    });
  </script>
</body>
</html>
